<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outil de Test MCP Indépendant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <h1>Console de Test MCP (Standalone)</h1>

    <div class="form-group">
        <label for="mcp_apikey">Clé API Agent (X-API-Key) :</label>
        <input type="text" id="mcp_apikey" placeholder="Collez la clé API agent ici">
    </div>

    <div class="form-group">
        <label for="mcp_endpoint">Endpoint agent :</label>
        <select id="mcp_endpoint">
            <option value="/api/agent/capabilities">GET /capabilities — droits de l'agent</option>
            <option value="/api/agent/alerts">GET /alerts — produits sous ROP</option>
            <option value="/api/agent/inventory">GET /inventory — stock réel</option>
            <option value="/api/agent/valuation">GET /valuation — valorisation stock</option>
            <option value="/api/agent/reorder-suggestions">GET /reorder-suggestions — suggestions EOQ</option>
            <option value="/api/agent/expiring-lots">GET /expiring-lots — lots expirants</option>
            <option value="/api/agent/proposals/mine">GET /proposals/mine — mes propositions</option>
        </select>
    </div>

    <div class="form-group">
        <label for="mcp_params">Paramètres additionnels (JSON, optionnel) :</label>
        <input type="text" id="mcp_params" placeholder='Ex: {"low_stock_only": true} ou {"days": 60}'>
    </div>

    <div class="form-group">
        <button onclick="sendToMCP()">Envoyer au Serveur MCP</button>
        <div id="status_msg" class="status">En attente d'une action...</div>
    </div>

    <div class="form-group">
        <label for="mcp_output">Réponse du Serveur (JSON Brut) :</label>
        <textarea id="mcp_output" readonly placeholder="Les données s'afficheront ici..."></textarea>
    </div>

    <script>
        window.onload = () => {
            const stored = localStorage.getItem('omistock_agent_key');
            if (stored) document.getElementById('mcp_apikey').value = stored;
        };

        async function sendToMCP() {
            const apiKey   = document.getElementById('mcp_apikey').value.trim();
            const endpoint = document.getElementById('mcp_endpoint').value;
            const paramsRaw = document.getElementById('mcp_params').value.trim();
            const outputBox = document.getElementById('mcp_output');
            const statusMsg = document.getElementById('status_msg');

            if (!apiKey) {
                alert("Veuillez entrer la clé API agent.");
                return;
            }

            localStorage.setItem('omistock_agent_key', apiKey);

            let url = endpoint;
            if (paramsRaw) {
                try {
                    const params = JSON.parse(paramsRaw);
                    const qs = new URLSearchParams(params).toString();
                    if (qs) url += '?' + qs;
                } catch {
                    alert("Paramètres JSON invalides.");
                    return;
                }
            }

            outputBox.value = "";
            statusMsg.textContent = "Requête en cours...";

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'X-API-Key': apiKey }
                });

                statusMsg.textContent = `Statut HTTP : ${response.status} ${response.statusText}`;

                try {
                    const data = await response.json();
                    outputBox.value = JSON.stringify(data, null, 4);
                } catch {
                    outputBox.value = await response.text();
                }

            } catch (error) {
                statusMsg.textContent = "Erreur de connexion !";
                outputBox.value = `Erreur lors du fetch :\n${error.message}\n\nVérifiez que le serveur est bien en ligne sur l'adresse API.`;
            }
        }
    </script>
</body>
</html>
